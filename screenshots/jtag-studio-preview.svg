<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg-grad)" />

  <!-- Window Header -->
  <rect x="30" y="25" width="1140" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="55" cy="47" r="6" fill="#ef4444" />
  <circle cx="75" cy="47" r="6" fill="#f59e0b" />
  <circle cx="95" cy="47" r="6" fill="#10b981" />
  <text x="120" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">JTAGForge Pro v1.0.0 — Silicon Boundary-Scan Studio &amp; Security Auditor</text>
  <rect x="1020" y="37" width="130" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="1035" y="52" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">● TAP Engine Ready</text>

  <!-- Navigation Tabs -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="180" height="36" rx="6" fill="url(#accent-cyan)" />
    <text x="20" y="23" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">🔄 16-State TAP FSM</text>

    <rect x="190" y="0" width="190" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="210" y="23" fill="#94a3b8" font-family="sans-serif" font-size="13">🔍 32-Bit IDCODE</text>

    <rect x="390" y="0" width="180" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="410" y="23" fill="#94a3b8" font-family="sans-serif" font-size="13">📜 BSDL VHDL Parser</text>

    <rect x="580" y="0" width="200" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="600" y="23" fill="#94a3b8" font-family="sans-serif" font-size="13">🛡️ Security Auditor</text>

    <rect x="790" y="0" width="200" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="810" y="23" fill="#94a3b8" font-family="sans-serif" font-size="13">💾 SVF &amp; OpenOCD</text>
  </g>

  <!-- Left Card: TAP Controller FSM -->
  <rect x="30" y="135" width="550" height="530" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
  <text x="55" y="170" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">16-State Finite State Machine Navigator</text>
  <rect x="460" y="153" width="95" height="22" rx="4" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" />
  <text x="472" y="168" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="bold">IEEE 1149.1</text>

  <rect x="55" y="195" width="500" height="60" rx="6" fill="#0b0f17" stroke="#1e293b" stroke-width="1" />
  <text x="75" y="218" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">CURRENT TAP STATE</text>
  <text x="75" y="243" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">SHIFT_DR</text>

  <!-- Clocking Action Buttons -->
  <g transform="translate(55, 275)">
    <rect x="0" y="0" width="150" height="36" rx="6" fill="#334155" />
    <text x="35" y="22" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Clock TMS = 0</text>

    <rect x="165" y="0" width="150" height="36" rx="6" fill="#334155" />
    <text x="200" y="22" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Clock TMS = 1</text>

    <rect x="330" y="0" width="170" height="36" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
    <text x="350" y="22" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="bold">Hardware Reset</text>
  </g>

  <!-- FSM Transition Graph Simulation View -->
  <rect x="55" y="335" width="500" height="305" rx="8" fill="#0b0f17" stroke="#1e293b" stroke-width="1" />
  <text x="75" y="365" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">⚡ Calculated Shortest-Path Bitstream</text>
  <text x="75" y="395" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Target State: SHIFT_DR</text>
  <text x="75" y="420" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Start State:  TEST_LOGIC_RESET</text>
  <text x="75" y="450" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13">Path: RESET → RUN_TEST_IDLE → SELECT_DR → CAPTURE_DR → SHIFT_DR</text>
  <text x="75" y="480" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13">TMS Bitstream: [0, 1, 0, 0] (4 TCK Clocks)</text>

  <!-- Right Card: 32-Bit IDCODE Dissector & Security -->
  <rect x="610" y="135" width="560" height="530" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
  <text x="635" y="170" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">32-Bit Silicon IDCODE Dissector</text>
  <rect x="1055" y="153" width="90" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="1068" y="168" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">IEEE Compliant</text>

  <!-- IDCODE Bitfield Visualizer -->
  <g transform="translate(635, 195)">
    <rect x="0" y="0" width="80" height="55" rx="4" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1" stroke-width="1" />
    <text x="10" y="22" fill="#c7d2fe" font-family="sans-serif" font-size="10">Ver (31..28)</text>
    <text x="25" y="43" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">0x0</text>

    <rect x="90" y="0" width="190" height="55" rx="4" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1" />
    <text x="105" y="22" fill="#a5f3fc" font-family="sans-serif" font-size="10">Part Number (27..12)</text>
    <text x="155" y="43" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">0x4991</text>

    <rect x="290" y="0" width="150" height="55" rx="4" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <text x="305" y="22" fill="#a7f3d0" font-family="sans-serif" font-size="10">Mfg ID (11..1)</text>
    <text x="345" y="43" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">0x021</text>

    <rect x="450" y="0" width="60" height="55" rx="4" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
    <text x="458" y="22" fill="#fde68a" font-family="sans-serif" font-size="10">Bit 0</text>
    <text x="473" y="43" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">1</text>
  </g>

  <!-- IDCODE Table Details -->
  <g transform="translate(635, 270)">
    <rect x="0" y="0" width="510" height="150" rx="6" fill="#0b0f17" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="12">Raw Hex Value:</text>
    <text x="180" y="30" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">0x04991043</text>

    <text x="20" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">Silicon Target:</text>
    <text x="180" y="60" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">STM32F407 (ARM Cortex-M4)</text>

    <text x="20" y="90" fill="#94a3b8" font-family="sans-serif" font-size="12">Manufacturer (JEDEC):</text>
    <text x="180" y="90" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">STMicroelectronics (Bank 1)</text>

    <text x="20" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">IEEE 1149.1 Bit 0 Rule:</text>
    <text x="180" y="120" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">✓ Valid (Must be 1 to distinguish BYPASS)</text>
  </g>

  <!-- Hardware Security Score Banner -->
  <g transform="translate(635, 440)">
    <rect x="0" y="0" width="510" height="200" rx="8" fill="#0b0f17" stroke="#1e293b" stroke-width="1" />
    <circle cx="65" cy="65" r="45" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="210 70" />
    <text x="47" y="72" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="bold">65</text>
    <text x="135" y="55" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold">Silicon Security Score: Moderate Risk</text>
    <text x="135" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">RDP Level 1 Password Active &bull; AHB-AP Readout Blocked</text>

    <rect x="20" y="130" width="470" height="50" rx="4" fill="#1e293b" />
    <text x="35" y="152" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">[WARN SEC-03] EXTEST Pin Hijacking Active</text>
    <text x="35" y="168" fill="#94a3b8" font-family="sans-serif" font-size="11">Fuse-gate EXTEST mode in production to prevent malicious pin overdrive.</text>
  </g>
</svg>
